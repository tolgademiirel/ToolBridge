services:
  toolbridge-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: toolbridge-api:local
    container_name: toolbridge-api
    restart: unless-stopped
    ports:
      - "${TOOLBRIDGE_API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_GCServer: "0"
      DOTNET_GCHeapHardLimitPercent: "35"
      DOTNET_EnableDiagnostics: "0"
    mem_limit: 512m
    cpus: 1.0
    networks:
      - toolbridge-bridge

networks:
  toolbridge-bridge:
    driver: bridge
